name: Broadcast Isolated Check

# Two prior runs of this workflow hung to the job's own timeout ceiling
# with zero diagnostic data recovered -- traced the real cause via this
# project's own history (not guessed): a JOB-level timeout force-kills
# the entire job, including the "commit outbox back" step, even though
# that step has if: always(). A STEP-level timeout on just the script
# step fails that one step gracefully instead -- GHA doesn't cancel
# sibling steps on a normal step failure, so the commit step still runs
# and whatever partial checkpoint/manifest data exists at the moment of
# the timeout actually gets preserved and becomes readable.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - name: run verification script
        timeout-minutes: 2
        continue-on-error: true
        run: node scripts/verify-broadcast-isolated.mjs
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "broadcast-isolated-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: broadcast-isolated-check results [skip ci]"
          git push
