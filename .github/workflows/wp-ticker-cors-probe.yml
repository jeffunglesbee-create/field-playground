name: WP Ticker CORS Probe

# Live WP Ticker (Proposal #2) pre-build check: does MLB's real API
# allow direct browser fetch (CORS), or does it need proxying like
# field-relay-nba already does for other sources? Checked before
# building any client-fetch component on top of an assumption.
#
# statsapi.mlb.com / baseballsavant.mlb.com are sandbox-blocked from
# the chat environment (confirmed via the proxy status endpoint) --
# CI-as-proxy, same pattern as every prior probe this session.

on:
  workflow_dispatch: {}
  schedule:
    # Weekly health check: if MLB ever tightens CORS, the Live WP
    # Ticker's direct client fetch breaks silently in every real
    # browser at once -- this catches that automatically instead of
    # relying on a user report. Automated follow-up, not a one-off.
    - cron: '45 9 * * 1'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe CORS headers on real MLB endpoints
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/probe-wp-ticker-cors.mjs | tee outbox/wp-ticker-cors-probe-result.txt

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "wp-ticker-cors-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: wp ticker CORS probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
