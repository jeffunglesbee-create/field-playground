name: EPL ESPN+FPL Probe

# Verifies real Premier League data availability via ESPN's soccer API
# (eng.1 league code) and the official Fantasy Premier League (FPL)
# API. Both confirmed sandbox-blocked before this workflow was written
# (connection refused on all four test URLs) -- CI-as-proxy, same
# pattern as every real-data probe this session.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe ESPN eng.1 + FPL API
        timeout-minutes: 4
        continue-on-error: true
        run: node scripts/probe-epl-espn-fpl.mjs

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "epl-espn-fpl-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: EPL ESPN+FPL probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
