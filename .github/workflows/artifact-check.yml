name: Artifact Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: build the artifact target (zero-chunk)
        run: npx vite build --config vite.config.artifact.js
      - run: npx playwright install chromium
      - name: verify the shipped artifact actually renders
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/verify-artifact.mjs
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "artifact-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: artifact-check results [skip ci]"
          git push
