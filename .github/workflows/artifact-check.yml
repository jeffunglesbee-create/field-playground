name: Artifact Check

# Scheduled (2026-07-28): this is the offline-mode smoke test behind
# several of this session's "verified live" claims (allPass, dead-
# section count, no uncaught page errors) -- it had no push trigger at
# all, manual-only, so it only ran when someone remembered to ask.
# Same [skip ci] blind spot as build-check.yml/deploy-playground.yml
# would apply to a push trigger here too, so a schedule is the actual
# fix rather than adding a push trigger that would go quietly dead the
# same way. Daily, same cadence as build-check.yml, since this is a
# real-app regression guard, not a slow-drifting data table.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: build the artifact target (zero-chunk)
        run: npx vite build --config vite.config.artifact.js
      - run: npx playwright install chromium
      - name: verify the shipped artifact actually renders
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/verify-artifact.mjs
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "artifact-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: artifact-check results [skip ci]"
          git push
