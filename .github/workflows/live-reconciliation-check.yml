name: Live Reconciliation Check

# Closes the gap docs/EXPERIMENT-live-reconciliation.md left open: chat's
# own sandbox can't download a real browser (Chromium blocked from
# storage.googleapis.com there, confirmed by trying) and a Node-only
# harness proved unreliable for testing SolidJS's actual reactive
# scheduler. GHA has real, unrestricted egress -- same reasoning as
# rule-gha-for-sandbox-egress-blocks elsewhere in this project, applied
# here for the first time in field-playground specifically.
#
# 2026-07-24: two runs stuck in_progress for 2.5+ hours each -- real,
# reproducible, not bad luck. Added a 10-minute job timeout + dropped
# --with-deps as a first fix; the timeout correctly fired at 10 minutes
# (confirmed -- status went to "cancelled" right on schedule) but that
# only proves the safety net works, not that the hang is gone. outbox/
# was completely empty on that run -- my own script never got far enough
# to write even its own error-path manifest, meaning the hang is in
# checkout/npm-install/playwright-install, before scripts/
# verify-reconciliation.mjs starts at all. Split into per-step timeouts
# instead of one job-level one, specifically so the NEXT run narrows
# down which step, rather than failing opaquely a third time.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  reconciliation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: 22

      - name: npm install
        timeout-minutes: 3
        run: npm install

      - name: playwright install (chromium only, no --with-deps)
        timeout-minutes: 3
        run: npx playwright install chromium

      - name: run verification script
        timeout-minutes: 2
        run: node scripts/verify-reconciliation.mjs

      - name: Upload manifest + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-check-results
          path: outbox/reconciliation-check-*
          if-no-files-found: warn
