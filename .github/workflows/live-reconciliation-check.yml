name: Live Reconciliation Check

# Closes the gap docs/EXPERIMENT-live-reconciliation.md left open: chat's
# own sandbox can't download a real browser (Chromium blocked from
# storage.googleapis.com there, confirmed by trying) and a Node-only
# harness proved unreliable for testing SolidJS's actual reactive
# scheduler. GHA has real, unrestricted egress -- same reasoning as
# rule-gha-for-sandbox-egress-blocks elsewhere in this project, applied
# here for the first time in field-playground specifically.
#
# 2026-07-24: both the first workflow_dispatch run and the first push-
# triggered run got stuck at "in_progress" for 2.5+ hours -- a real,
# reproducible problem, not one-off bad luck. No job-level timeout meant
# it would have hung until GHA's own 6-hour default ceiling with zero
# useful feedback in the meantime. Added timeout-minutes so a genuine
# hang fails fast and visibly instead of silently consuming CI time.
# Also dropped --with-deps from the playwright install -- it apt-installs
# a large set of OS packages on top of the browser download, which is
# the more likely actual hang (package manager lock contention, slow
# mirror) versus just fetching the Chromium binary. ubuntu-latest
# runners typically already have what plain chromium needs; --with-deps
# exists for minimal/custom images, not the default GHA runner.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  reconciliation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: node scripts/verify-reconciliation.mjs
      - name: Upload manifest + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-check-results
          path: outbox/reconciliation-check-*
