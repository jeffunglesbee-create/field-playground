name: Soundscape CDN Load Probe

# Tests DramaSoundscape's actual CDN import path against the real
# deployed site -- deliberately NOT offline, since the whole point is
# confirming the esm.sh Tone.js fetch genuinely completes for a real
# user, which artifact-check.yml's offline harness structurally cannot
# exercise (it never simulates the enable-sound click at all).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install playwright --no-save
      - run: npx playwright install chromium --with-deps
      - name: Click enable-sound on the real deployed site
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/probe-soundscape-cdn-load.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "soundscape-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: soundscape CDN load probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
