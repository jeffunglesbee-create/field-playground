name: Reconciliation Check V3

# Build-then-serve-static, not spawn-a-dev-server. See
# scripts/verify-reconciliation.mjs's own header for the full reasoning.
#
# Prior runs failed fast (~45-50s) with nothing visible -- traced to a
# real gap in this workflow itself, not the script: upload-artifact
# stores results as a GHA artifact, which chat has no tool to download.
# Every previously-working probe in this project (chip-overflow-probe.yml
# etc.) commits its output back to the repo directly -- this file never
# did. Fixed: commit outbox/ back to main after the script runs,
# regardless of pass/fail, so checkpoint logs are actually visible.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - run: node scripts/verify-reconciliation.mjs
        continue-on-error: true
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "reconciliation-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: reconciliation-check-v3 results [skip ci]"
          git push
