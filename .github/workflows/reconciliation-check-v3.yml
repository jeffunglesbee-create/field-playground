name: Reconciliation Check V3

# Build-then-serve-static, not spawn-a-dev-server. See
# scripts/verify-reconciliation.mjs's own header for the full reasoning.
#
# First run of this file failed in ~40s -- too fast to have reached the
# actual script, meaning it hit one of the per-step timeouts (checkout=1m
# or setup-node=1m) rather than a real error in the redesigned approach.
# Those budgets were too tight, not a sign anything is actually broken.
# Generous job-level ceiling only now -- the goal is testing whether the
# build+serve+route-intercept redesign itself works, not fine-grained
# per-step diagnostics at this stage.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - run: node scripts/verify-reconciliation.mjs
      - name: Upload manifest + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-check-v3-results
          path: outbox/reconciliation-check-*
          if-no-files-found: warn
