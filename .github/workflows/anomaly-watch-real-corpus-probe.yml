name: Anomaly Watch Real Corpus Probe

# Exercises AnomalyWatch's SHIPPED analysis against the real uncensored corpus.
#
# The local dev mock returns a fixture slate with 3 distinct drama_peak values
# for MLB. The real corpus carries ~34 across 470 scored games. So a browser run
# proves the component renders and handles its states, and proves nothing about
# the percentile path -- which is the feature. This closes that gap.
#
# It bundles src/data via esbuild and runs the real buildBaselines/describeSlate
# rather than a re-implementation: testing a copy would only prove the copy
# agrees with itself.
#
# Standing, not one-off. It reports the FIRING RATE of every named condition,
# which is the thing that rots silently: a condition that stops firing (or
# starts firing on most games) is no longer an anomaly detector, and nothing
# else in the app would notice.

on:
  schedule:
    - cron: '27 12 * * 1'   # Mondays 12:27 UTC, after the soccer probes
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to sweep'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run shipped anomaly analysis against the real corpus
        timeout-minutes: 14
        continue-on-error: true
        env:
          PROBE_DAYS: ${{ github.event.inputs.days || '30' }}
        run: node scripts/probe-anomaly-watch-real-corpus.mjs
      - name: Commit probe result
        if: always()
        run: |
          git config user.name "anomaly-watch-real-corpus-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: anomaly watch real corpus probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
