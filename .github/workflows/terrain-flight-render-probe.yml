name: Terrain Flight Render Probe

# The one thing that could not be verified locally before committing:
# a real Three.js CDN load (esm.sh returns 403 from direct chat-sandbox
# access) and a real WebGL render, against real archived-game data.
# Serves the real built app (npm run preview), not page.setContent(),
# so real relay + real esm.sh fetches behave exactly as a real visitor
# would experience them.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Serve the real built app and verify Terrain Flight's real 3D render
        timeout-minutes: 4
        continue-on-error: true
        env:
          PREVIEW_URL: http://localhost:4173
        run: |
          # Backgrounding a server in one CI step and testing it in a
          # separate step doesn't reliably survive the step boundary in
          # GitHub Actions (the process can be reaped when the step's
          # own shell exits) -- confirmed the hard way: the first
          # version of this workflow split serve/verify into two steps
          # and every run timed out on page.goto with nothing listening
          # on the port. Serve and verify in the SAME step instead,
          # matching the exact nohup+disown pattern already used
          # throughout this session's local verification runs.
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && break
            sleep 1
          done
          cat preview.log
          node scripts/verify-terrain-flight-render.mjs

      - name: Commit probe result + screenshot
        if: always()
        run: |
          git config user.name "terrain-flight-render-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: terrain flight render probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
