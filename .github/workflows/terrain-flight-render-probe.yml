name: Terrain Flight Render Probe

# The one thing that could not be verified locally before committing:
# a real Three.js CDN load (esm.sh returns 403 from direct chat-sandbox
# access) and a real WebGL render, against real archived-game data.
# Serves the real built app (npm run preview), not page.setContent(),
# so real relay + real esm.sh fetches behave exactly as a real visitor
# would experience them.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Serve the real built app and verify Terrain Flight's real 3D render
        timeout-minutes: 4
        continue-on-error: true
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: |
          # Round 1: split serve/verify into two steps -- every run
          # timed out with nothing listening (step boundary didn't
          # preserve the backgrounded process). Round 2: combined into
          # one step with nohup+disown -- STILL timed out, same
          # symptom, so that wasn't the only real cause. Two real
          # fixes this round, not another guess: (1) `localhost` can
          # resolve to ::1 on some CI runners while vite preview binds
          # an IPv4-only 127.0.0.1 by default -- a known real Node/CI
          # mismatch -- so both the curl wait and PREVIEW_URL now use
          # 127.0.0.1 explicitly everywhere, removing the ambiguity
          # rather than hoping resolution lines up. (2) preview.log
          # was only ever `cat` to ephemeral CI console output this
          # script can't see after the fact -- committed to outbox/
          # now so a THIRD failure is diagnosable instead of another
          # blind guess.
          mkdir -p outbox
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > outbox/terrain-flight-preview.log 2>&1 &
          disown
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then ok=1; break; fi
            sleep 1
          done
          echo "server_ready=$ok" >> outbox/terrain-flight-preview.log
          cat outbox/terrain-flight-preview.log
          node scripts/verify-terrain-flight-render.mjs

      - name: Commit probe result + screenshot
        if: always()
        run: |
          git config user.name "terrain-flight-render-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: terrain flight render probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
