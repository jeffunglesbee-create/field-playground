# Chase the claims ledger's own follow-ups, on a schedule, into an issue.
#
# WHY A SCHEDULED JOB AND NOT A CHECK. check-claims.mjs already warns about
# unattempted cheap falsifiers on every build, and those warnings had been
# printing for days without anyone acting on them. A warning inside a green
# build is not a follow-up; it is decoration. The thing that makes a follow-up
# real is that it outlives the session that created it, which is what an issue
# does and a log line does not.
#
# WHY IT DOES NOT FAIL THE BUILD. Blocking a merge on "you owe a search" would
# get the check disabled inside a week. It reports, ranks, and nags; a human
# decides. --strict is used for the step's own exit code only, and the issue is
# written either way.
name: Claims follow-ups

on:
  schedule:
    # Mondays 14:00 UTC. Weekly, because these are debts measured in days.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  followups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the follow-up list
        id: list
        run: |
          set -o pipefail
          # Capture the report and the overdue exit code separately: a non-zero
          # exit here means "there is debt", which is information, not failure.
          if node scripts/followups.mjs --strict > followups.md 2> overdue.txt; then
            echo "overdue=0" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=1" >> "$GITHUB_OUTPUT"
          fi
          cat followups.md

      - name: Sync into a single tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('followups.md', 'utf8')
            const TITLE = 'Claims ledger: open follow-ups'
            const { owner, repo } = context.repo

            // One issue, updated in place. Opening a fresh issue per run would
            // bury the real list under a stack of near-identical ones -- the
            // same noise problem that made the build warnings ignorable.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'claims-followup', per_page: 10,
            })
            const stamped = body +
              `\n\n---\n_Synced by \`.github/workflows/followups.yml\` from run ` +
              `[${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId})._\n`

            if (existing.data.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.data[0].number, body: stamped,
              })
              core.info(`Updated #${existing.data[0].number}`)
            } else if ('${{ steps.list.outputs.overdue }}' === '1') {
              // Only OPEN an issue when something is actually overdue. A clean
              // ledger should leave no artifact at all.
              await github.rest.issues.create({
                owner, repo, title: TITLE, body: stamped, labels: ['claims-followup'],
              })
              core.info('Opened tracking issue')
            } else {
              core.info('Nothing overdue and no open issue; nothing to do.')
            }

  # The e2e probe is the other half of "automate follow-ups": several ledger
  # claims are only as fresh as the last real measurement of the weather API.
  # Re-running it weekly is what keeps them from quietly going stale, and it is
  # the run that has now caught a unit bug and a bad assertion on two separate
  # first attempts.
  reprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-measure the live weather path
        run: node scripts/probe-open-meteo-e2e.mjs
