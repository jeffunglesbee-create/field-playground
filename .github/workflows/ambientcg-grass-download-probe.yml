name: AmbientCG Grass Download Probe

# Verifies ambientCG's real public API actually returns a real,
# downloadable, CC0-licensed grass texture asset -- ambientcg.com is
# sandbox-blocked from chat (a direct curl gets a connection-level
# failure), so this is CI-as-proxy, same pattern as every prior probe
# this session.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check real ambientCG Grass001 download
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/probe-ambientcg-grass-download.mjs

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "ambientcg-grass-download-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: ambientCG grass download probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
