name: Outcomes Sync Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - name: run verification script
        timeout-minutes: 2
        continue-on-error: true
        run: node scripts/verify-outcomes-sync.mjs
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "outcomes-sync-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: outcomes-sync-check results [skip ci]"
          git push
