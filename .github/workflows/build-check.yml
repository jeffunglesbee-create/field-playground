name: Build Check

# Exists because of a real, documented gap: the AmbientPanel/DeskCard
# rebuild's own production build wasn't run until several turns after
# the components were declared done (see docs/GROUND-UP-DESIGN.md
# principle #7's 2026-07-24 revision). It built clean when finally run,
# but "verification ships with the feature" didn't happen in practice.
# This is the lightweight, low-ceremony version of closing that gap —
# no confidence gates, no Codex logging, just: does it actually build.
#
# Scheduled (2026-07-28): the push trigger above has been effectively
# dead this whole session for the same reason deploy-playground.yml's
# was -- every MCP-authored commit here carries [skip ci], which
# suppresses push-triggered workflows too. This is the one check
# answering "does this actually build," so a silently-dead trigger on
# it is worse than on most other workflows: a real build break could
# have landed on main undetected the entire time. Daily rather than
# weekly, since a broken build is the kind of regression worth
# catching sooner than a slow-drifting data table.
#
# Resource-safety check added 2026-08-02: the same createResource
# source-accessor re-throw bug (src/data/safeResource.js) had been
# independently hand-fixed 4+ times in different components before a
# real automated guard existed. Runs scripts/check-resource-safety.mjs
# right after the build step, same low-ceremony posture as the rest of
# this workflow.
#
# Unread-createMemo check added 2026-08-03: a different real, documented
# Solid.js bug class from this session's own history (DramaSoundscape,
# found 2026-07-31) -- a createMemo with zero consumers runs once and
# never re-runs, silently. scripts/check-unread-memos.mjs was validated
# against both the historical bug shape and a legitimate false-positive
# candidate before being wired in here.
#
# Unguarded-localStorage check added 2026-08-03 (same day, third real
# bug class): a hand-audit of every localStorage call site in the
# codebase found src/data/outcomes.js -- load-bearing pick-tracking
# code read directly by 4 other components -- calling
# localStorage.setItem 10 times with no try/catch, unlike every other
# localStorage consumer in this codebase (all already guarded).
# scripts/check-localstorage-guards.mjs was validated by reproducing
# the exact unguarded shape and confirming three guarded variants
# (one-line, multi-line, mixed-within-function) are not flagged, then
# by fault-injecting a throwing localStorage.setItem against the real,
# fixed outcomes.js and confirming it survives (and against the
# pre-fix version, confirming it would have thrown).
#
# Undisposed-WebGLRenderer check added 2026-08-03 (same day, fourth real
# risk class): building Terrain Flight (src/components/TerrainFlight,
# real Three.js via esm.sh) introduced this codebase's first real GPU
# resource -- a WebGLRenderer leaks a real GPU context and its buffers
# on every unmount if not disposed in onCleanup. TerrainFlight itself
# does this correctly; scripts/check-webgl-disposal.mjs exists so the
# next WebGL-creating component can't regress it silently. Validated by
# reproducing an undisposed renderer and a renderer disposed outside
# onCleanup (both flagged), and confirming the real, correct
# TerrainFlight component is not flagged.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check for the resource-accessor re-throw bug class
        run: node scripts/check-resource-safety.mjs
      - name: Check for unread createMemo declarations
        run: node scripts/check-unread-memos.mjs
      - name: Check for unguarded localStorage calls
        run: node scripts/check-localstorage-guards.mjs
      - name: Check for undisposed WebGLRenderer instances
        run: node scripts/check-webgl-disposal.mjs
      # Offline correctness guard for the anomaly analysis -- no relay, no
      # network, deterministic (seeded PRNG). Tests properties that must hold
      # for ANY input: the definitional firing rate of rare-high/rare-low
      # against a brute-force recomputation, order-independence, monotonicity,
      # duplication invariance, and leave-one-out exactness. The real-corpus
      # probe is confirmatory -- it runs the shipped code and reports what that
      # code says -- so it cannot catch arithmetic that is internally
      # consistent and wrong. This can, and it runs on every build.
      - name: Check anomaly analysis invariants
        run: node scripts/check-anomaly-invariants.mjs
      # Both of these guard silent grading/parsing defects that cannot be
      # reproduced by driving the app -- one needs a real draw on the slate,
      # the other needs an archive-keyed outcome nobody has in localStorage.
      # A fixture test is the only place either fix is observable.
      - name: Check game-id parsing against real measured ids
        run: node scripts/check-gameid-parse.mjs
      - name: Check pick grading (draws credit neither side)
        run: node scripts/check-pick-grading.mjs
      - name: Report bundle size
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          ls -la dist/assets/ >> $GITHUB_STEP_SUMMARY
