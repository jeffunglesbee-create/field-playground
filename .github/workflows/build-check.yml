name: Build Check

# Exists because of a real, documented gap: the AmbientPanel/DeskCard
# rebuild's own production build wasn't run until several turns after
# the components were declared done (see docs/GROUND-UP-DESIGN.md
# principle #7's 2026-07-24 revision). It built clean when finally run,
# but "verification ships with the feature" didn't happen in practice.
# This is the lightweight, low-ceremony version of closing that gap —
# no confidence gates, no Codex logging, just: does it actually build.
#
# Scheduled (2026-07-28): the push trigger above has been effectively
# dead this whole session for the same reason deploy-playground.yml's
# was -- every MCP-authored commit here carries [skip ci], which
# suppresses push-triggered workflows too. This is the one check
# answering "does this actually build," so a silently-dead trigger on
# it is worse than on most other workflows: a real build break could
# have landed on main undetected the entire time. Daily rather than
# weekly, since a broken build is the kind of regression worth
# catching sooner than a slow-drifting data table.
#
# Resource-safety check added 2026-08-02: the same createResource
# source-accessor re-throw bug (src/data/safeResource.js) had been
# independently hand-fixed 4+ times in different components before a
# real automated guard existed. Runs scripts/check-resource-safety.mjs
# right after the build step, same low-ceremony posture as the rest of
# this workflow.
#
# Unread-createMemo check added 2026-08-03: a different real, documented
# Solid.js bug class from this session's own history (DramaSoundscape,
# found 2026-07-31) -- a createMemo with zero consumers runs once and
# never re-runs, silently. scripts/check-unread-memos.mjs was validated
# against both the historical bug shape and a legitimate false-positive
# candidate before being wired in here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check for the resource-accessor re-throw bug class
        run: node scripts/check-resource-safety.mjs
      - name: Check for unread createMemo declarations
        run: node scripts/check-unread-memos.mjs
      - name: Report bundle size
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          ls -la dist/assets/ >> $GITHUB_STEP_SUMMARY
