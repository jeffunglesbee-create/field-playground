name: Sport Of Week Shape Probe

# Follow-up to ambient-multiday-probe.yml, which found sport_of_week
# renders as "[object Object]" on real dates including today. Dumps the
# raw real shape before fixing AmbientPanel's SportOfWeekBanner.
#
# field-relay-nba.jeffunglesbee.workers.dev is sandbox-blocked from
# chat -- CI-as-proxy, same pattern as every prior probe this session.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump raw sport_of_week shape for real dates
        timeout-minutes: 4
        continue-on-error: true
        run: node scripts/probe-sport-of-week-shape.mjs

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "sport-of-week-shape-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: sport-of-week shape probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
