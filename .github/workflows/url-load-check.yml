name: URL Load Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium
      - run: node scripts/verify-url-load.mjs
        continue-on-error: true
      - name: Commit outbox results back to the repo
        if: always()
        run: |
          git config user.name "url-load-check-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: url-load-check results [skip ci]"
          git push
