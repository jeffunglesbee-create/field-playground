name: BSD XG Validity Probe

# Continuing docs/GROUND-UP-DESIGN.md principle 10: checks BSD's real
# expected_goals/ball_possession fields (rendered by BsdXgPanel with
# only a nullish fallback, no range check) against the real contract
# implied by their meaning -- non-negative finite xG, possession in
# [0,100], home+away possession summing to ~100.
#
# field-relay-nba.jeffunglesbee.workers.dev is sandbox-blocked from
# chat -- CI-as-proxy, same pattern as every prior probe this session.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check BSD expected_goals/ball_possession validity
        timeout-minutes: 6
        continue-on-error: true
        run: node scripts/probe-bsd-xg-validity.mjs

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "bsd-xg-validity-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: BSD xG validity probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
