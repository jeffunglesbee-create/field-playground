name: Open-Meteo Probe

# CI-as-proxy. The chat sandbox's egress allowlist does not include
# api.open-meteo.com, so a direct curl from there returns 403 -- that is
# the sandbox refusing, NOT Open-Meteo rejecting. GitHub Actions runners
# are not egress-restricted, so the runner fetches it and commits the
# result back for chat to read. Documented pattern (STANDARDS.md,
# established May 2026 for probing Baseball Savant).
#
# Questions this must answer:
#   1. Is Open-Meteo reachable without an API key?
#   2. Does it send access-control-allow-origin: * ? That is the
#      load-bearing fact -- CORS-open means the browser can call it
#      directly and no relay proxy is needed, which is why no /weather
#      route exists on field-relay-nba.
#   3. What is the real payload shape for a real venue?

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe Open-Meteo (Comerica Park, Detroit)
        timeout-minutes: 2
        continue-on-error: true
        env:
          URL: "https://api.open-meteo.com/v1/forecast?latitude=42.3390&longitude=-83.0485&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code&forecast_days=1&temperature_unit=fahrenheit&wind_speed_unit=mph"
        run: |
          mkdir -p outbox
          OUT=outbox/open-meteo-probe.txt
          echo "probe_at: $(date -u +%FT%TZ)" > "$OUT"
          echo "url: $URL" >> "$OUT"
          echo "" >> "$OUT"
          echo "=== HEADERS (CORS is the point; no API key was sent) ===" >> "$OUT"
          curl -sS -D /tmp/hdr.txt -o /tmp/body.json -w "http_code: %{http_code}\n" -H "Origin: https://field-playground.jeffunglesbee.workers.dev" "$URL" >> "$OUT" 2>&1 || true
          grep -iE "^HTTP/|access-control-|content-type|vary" /tmp/hdr.txt >> "$OUT" 2>&1 || true
          echo "" >> "$OUT"
          echo "=== CORS VERDICT (simple GET with Origin) ===" >> "$OUT"
          if grep -qi "access-control-allow-origin" /tmp/hdr.txt; then
            grep -i "access-control-allow-origin" /tmp/hdr.txt >> "$OUT"
            echo "VERDICT: CORS-OPEN -- browser can call this directly, no relay proxy needed" >> "$OUT"
          else
            echo "VERDICT: NO access-control-allow-origin header returned" >> "$OUT"
            echo "  -> browser WOULD BLOCK a direct client-side call; a relay proxy IS required" >> "$OUT"
          fi
          echo "" >> "$OUT"
          echo "=== PREFLIGHT (OPTIONS, as a browser would send for a non-simple request) ===" >> "$OUT"
          curl -sS -X OPTIONS -D /tmp/pre.txt -o /dev/null -w "preflight_http_code: %{http_code}\n" -H "Origin: https://field-playground.jeffunglesbee.workers.dev" -H "Access-Control-Request-Method: GET" "$URL" >> "$OUT" 2>&1 || true
          grep -iE "^HTTP/|access-control-" /tmp/pre.txt >> "$OUT" 2>&1 || echo "  (no access-control-* headers on preflight)" >> "$OUT"
          echo "" >> "$OUT"
          echo "=== PARSED SHAPE (jq) ===" >> "$OUT"
          jq -r '"top-level keys: \(keys|join(", "))"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"hourly vars: \(.hourly|keys|join(", "))"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"units: \(.hourly_units|tostring)"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"timezone: \(.timezone) | elevation: \(.elevation)"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"first 6 temps: \(.hourly.temperature_2m[0:6]|tostring)"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"first 6 precip%: \(.hourly.precipitation_probability[0:6]|tostring)"' /tmp/body.json >> "$OUT" 2>&1 || true
          jq -r '"first 6 wind: \(.hourly.wind_speed_10m[0:6]|tostring)"' /tmp/body.json >> "$OUT" 2>&1 || true
          echo "" >> "$OUT"
          echo "=== RAW BODY (first 800 chars) ===" >> "$OUT"
          head -c 800 /tmp/body.json >> "$OUT" 2>&1 || true

      - name: Probe Open-Meteo Geocoding (real + indoor venue names from this repo's mock slate)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          OUT=outbox/open-meteo-geocoding-probe.txt
          echo "probe_at: $(date -u +%FT%TZ)" > "$OUT"
          echo "base: https://geocoding-api.open-meteo.com/v1/search" >> "$OUT"
          echo "" >> "$OUT"
          echo "Testing whether geocoding-by-name can replace this repo's hand-maintained" >> "$OUT"
          echo "VENUE_COORDS table, and whether it can tell indoor from outdoor -- the" >> "$OUT"
          echo "prediction from docs/outbox/chat-update-2026-07-26-weather-endpoint-investigation.md" >> "$OUT"
          echo "is that it CANNOT know dome status, only resolve a name to coordinates." >> "$OUT"
          echo "" >> "$OUT"
          for NAME in "Citizens Bank Park" "Yankee Stadium" "Globe Life Field" "America First Field" "Red Bull Arena" "Dick's Sporting Goods Park" "Footprint Center" "Target Center"; do
            echo "=== \"$NAME\" ===" >> "$OUT"
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$NAME")
            URL="https://geocoding-api.open-meteo.com/v1/search?name=${ENCODED}&count=3&language=en&format=json"
            curl -sS -o /tmp/geo.json -w "http_code: %{http_code}\n" "$URL" >> "$OUT" 2>&1 || true
            jq -r 'if .results then (.results | length | tostring) + " result(s)" else "0 results (no .results key)" end' /tmp/geo.json >> "$OUT" 2>&1 || echo "  (jq parse failed)" >> "$OUT"
            jq -r '.results[]? | "  - \(.name) (\(.admin1 // "?"), \(.country_code // "?")) at \(.latitude), \(.longitude) -- feature_code: \(.feature_code // "?")"' /tmp/geo.json >> "$OUT" 2>&1 || true
            echo "" >> "$OUT"
          done
          echo "=== CORS check (geocoding-api is a DIFFERENT host than api.open-meteo.com --" >> "$OUT"
          echo "the forecast endpoint's open CORS policy doesn't automatically apply here) ===" >> "$OUT"
          CORS_URL="https://geocoding-api.open-meteo.com/v1/search?name=Citizens+Bank+Park&count=1"
          curl -sS -D /tmp/geo-hdr.txt -o /dev/null -w "http_code: %{http_code}\n" -H "Origin: https://field-playground.jeffunglesbee.workers.dev" "$CORS_URL" >> "$OUT" 2>&1 || true
          if grep -qi "access-control-allow-origin" /tmp/geo-hdr.txt; then
            grep -i "access-control-allow-origin" /tmp/geo-hdr.txt >> "$OUT"
            echo "VERDICT: CORS-OPEN on geocoding-api.open-meteo.com too -- browser can call it directly" >> "$OUT"
          else
            echo "VERDICT: NO access-control-allow-origin on geocoding-api.open-meteo.com" >> "$OUT"
            echo "  -> a live in-browser demo would need a different approach (this is moot anyway" >> "$OUT"
            echo "     given the 7/8 miss rate above -- geocoding-by-name isn't viable regardless)" >> "$OUT"
          fi
          echo "" >> "$OUT"
          echo "=== VERDICT ===" >> "$OUT"
          echo "Read the results above by hand: does each real venue resolve to a" >> "$OUT"
          echo "plausible coordinate? Does anything in the response (feature_code," >> "$OUT"
          echo "elevation, name) distinguish an indoor arena from an outdoor stadium?" >> "$OUT"
          echo "If not, the prediction holds and a table stays required for the" >> "$OUT"
          echo "outdoor/indoor flag even if geocoding replaces the coordinate lookup." >> "$OUT"

      - name: Probe expanded VENUE_COORDS coverage (2026-07-27 retractable-roof reversal)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          OUT=outbox/open-meteo-venue-coverage-probe.txt
          echo "probe_at: $(date -u +%FT%TZ)" > "$OUT"
          echo "" >> "$OUT"
          echo "Verifies two changes to src/data/weather.js's VENUE_COORDS, both run" >> "$OUT"
          echo "from a GitHub Actions runner because this sandbox's egress allowlist" >> "$OUT"
          echo "blocks api.open-meteo.com directly:" >> "$OUT"
          echo "  1. Retractable-roof/domed venues now get real weather instead of" >> "$OUT"
          echo "     being excluded (production's own table gates on isOutdoor and" >> "$OUT"
          echo "     returns null for these -- this repo deliberately reverses that)." >> "$OUT"
          echo "  2. Three MLB parks confirmed absent from production's table" >> "$OUT"
          echo "     (PNC Park, Citi Field, Sutter Health Park) resolve to real," >> "$OUT"
          echo "     sane weather at their added coordinates." >> "$OUT"
          echo "" >> "$OUT"
          echo "Coordinates below are read directly out of src/data/weather.js's" >> "$OUT"
          echo "VENUE_COORDS at run time (not a hand-copied fixture) so this probe" >> "$OUT"
          echo "can't silently drift from the table it's meant to verify." >> "$OUT"
          echo "" >> "$OUT"

          node -e '
          const fs = require("fs");
          const src = fs.readFileSync("src/data/weather.js", "utf8");
          const marker = "export const VENUE_COORDS = {";
          const start = src.indexOf(marker);
          if (start === -1) throw new Error("VENUE_COORDS not found in src/data/weather.js");
          const objStart = start + marker.length - 1;
          let depth = 0, i = objStart;
          for (; i < src.length; i++) {
            if (src[i] === "{") depth++;
            else if (src[i] === "}") { depth--; if (depth === 0) break; }
          }
          const objText = src.slice(objStart, i + 1);
          const VENUE_COORDS = Function("return (" + objText + ")")();
          fs.writeFileSync("/tmp/venue_coords.json", JSON.stringify(VENUE_COORDS));
          '

          # Fixed subset to probe, by NAME only -- coordinates are looked up
          # from /tmp/venue_coords.json (the canonical table, parsed above),
          # never duplicated here. Covers all three roofTypes, including
          # Tropicana Field (the one true dome in the table -- retractable
          # roofs alone don't exercise the 'dome' branch), the three MLB
          # parks confirmed absent from production's table, and a handful
          # of today's real slate for a broader sanity check. Not all ~90+
          # entries -- this is a spot-check, not exhaustive coverage.
          VENUE_NAMES=(
            "Globe Life Field"
            "loanDepot park"
            "Rogers Centre"
            "Daikin Park"
            "Tropicana Field"
            "PNC Park"
            "Citi Field"
            "Sutter Health Park"
            "Comerica Park"
            "Nationals Park"
            "Great American Ball Park"
            "Rate Field"
            "Busch Stadium"
            "Angel Stadium"
            "Oracle Park"
            "TPC Twin Cities"
          )

          FAIL_COUNT=0
          for NAME in "${VENUE_NAMES[@]}"; do
            ENTRY=$(jq -c --arg n "$NAME" '.[$n] // empty' /tmp/venue_coords.json 2>/dev/null || echo "")
            if [ -z "$ENTRY" ]; then
              echo "$NAME: MISSING FROM VENUE_COORDS" >> "$OUT"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              continue
            fi
            LAT=$(echo "$ENTRY" | jq -r '.[0]')
            LON=$(echo "$ENTRY" | jq -r '.[1]')
            ROOF=$(echo "$ENTRY" | jq -r '.[2]')
            URL="https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,precipitation,rain,snowfall,is_day,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto"
            HTTP_CODE=$(curl -sS -o /tmp/venue.json -w "%{http_code}" "$URL" 2>/dev/null || echo "curl_failed")
            TEMP=$(jq -r '.current.temperature_2m // "n/a"' /tmp/venue.json 2>/dev/null || echo "n/a")
            echo "$NAME [$ROOF]: http=$HTTP_CODE temp_f=$TEMP" >> "$OUT"
            if [ "$HTTP_CODE" != "200" ] || [ "$TEMP" = "n/a" ] || [ "$TEMP" = "null" ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "" >> "$OUT"
          echo "=== VERDICT ===" >> "$OUT"
          if [ "$FAIL_COUNT" -eq 0 ]; then
            echo "All ${#VENUE_NAMES[@]} venues resolved: http=200 and a real" >> "$OUT"
            echo "temperature, roofType included, sourced straight from" >> "$OUT"
            echo "src/data/weather.js. Confirms the retractable/dome-roof reversal" >> "$OUT"
            echo "works: every site has real, fetchable weather regardless of roof" >> "$OUT"
            echo "status, including Tropicana Field, the one true fixed dome." >> "$OUT"
          else
            echo "$FAIL_COUNT of ${#VENUE_NAMES[@]} venues FAILED -- see the lines" >> "$OUT"
            echo "above marked MISSING, curl_failed, or a non-200/n-a result. This" >> "$OUT"
            echo "step exits non-zero on any failure (visible in job annotations)" >> "$OUT"
            echo "even though continue-on-error keeps the overall job green." >> "$OUT"
          fi

          exit "$FAIL_COUNT"

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "open-meteo-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet || git commit -m "chore: open-meteo probe result [skip ci]"
          git push
