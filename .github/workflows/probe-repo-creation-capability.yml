name: Probe Repo Creation Capability

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Attempt real repo creation with the default GITHUB_TOKEN
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          mkdir -p outbox || true
          OUT="outbox/repo-creation-probe-$(date -u +%Y%m%dT%H%M%SZ).txt"
          echo "file target: $OUT"
          {
            echo "=== real, empirical test: can the automatic GITHUB_TOKEN create a new repo? ==="
            echo "run started: $(date -u -Iseconds)"
          } > "$OUT" 2>&1 || true
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://api.github.com/user/repos" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"name":"field-laboratory-probe-delete-me","private":true}' 2>>"$OUT" || echo "000")
          {
            echo "HTTP: $HTTP_CODE"
            cat /tmp/resp.json 2>/dev/null || echo "(no response body captured)"
            echo ""
            echo "=== documented GitHub behavior: the default GITHUB_TOKEN is scoped only to"
            echo "the repo the workflow runs in, and cannot create a new, separate repo. This"
            echo "call is expected to fail -- proving that empirically, not asserting it. ==="
          } >> "$OUT" 2>&1 || true
          echo "=== final file contents ==="
          cat "$OUT" || echo "FILE DOES NOT EXIST"
          ls -la outbox/ || true
      - name: Commit result
        if: always()
        run: |
          git config user.name "repo-creation-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: repo creation probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
