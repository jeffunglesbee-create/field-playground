name: LaLiga APIM Investigation Probe

# CC-CMD-2026-08-02-laliga-apim-investigation. Confirms apim.laliga.com
# is genuinely reachable, finds real endpoint sub-paths by fetching
# laliga.com's own real script bundles, and makes one targeted probe.
# apim-int.laliga.com is never contacted -- verified via a hard grep
# check as part of this workflow, not just a comment in the script.
#
# Neither apim.laliga.com nor www.laliga.com is reachable from the
# chat sandbox (confirmed by direct curl before this workflow was
# written) -- CI-as-proxy, same pattern as every real-data probe this
# session.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Safety check — script never contacts apim-int
        run: |
          if grep -n "fetch(.*apim-int" scripts/probe-laliga-apim.mjs; then
            echo "REFUSING TO RUN: script references apim-int in a fetch call"
            exit 1
          fi
          echo "confirmed: no fetch() call targets apim-int in this script"

      - name: LaLiga APIM investigation (Tasks 1-3)
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/probe-laliga-apim.mjs

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "laliga-apim-probe-bot"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "chore: LaLiga APIM investigation probe result [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
