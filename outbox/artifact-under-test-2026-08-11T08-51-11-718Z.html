x — Personal Product Surfaces","date":"2026-07-25","phrase":"originally assumed","sentence":"**Bug found and fixed during review (CodeRabbit) — this one was real:** the score string is **away–home** ordered, not home–away as originally assumed (mirroring DeskCard\'s own `${displayAway()}–${displayHome()}` convention)."},{"file":"cc-session-2026-07-26-gamecard-mechanisms.md","title":"CC Session Outbox — Gamecard-Derived Mechanisms","date":"2026-07-26","phrase":"corrected","sentence":"Corrected to \\"the selected date\'s slate.\\" 3."},{"file":"cc-session-2026-07-26-orthogonal-mechanisms-and-health-panel.md","title":"CC Session Outbox — Orthogonal Mechanism Demos + Health Panel","date":"2026-07-26","phrase":"corrected","sentence":"`LatencyHistogram` — p95 index used `Math.floor(n * 0.95)` (selects the max at exact bucket boundaries); corrected to nearest-rank `Math.ceil(n * 0.95) - 1`."},{"file":"cc-session-2026-07-26-real-weather-and-geocode-race.md","title":"CC Session Outbox — Real Open-Meteo Weather + VenueGeocodeRace","date":"2026-07-26","phrase":"false negative","sentence":"**A real methodology bug, caught and fixed mid-investigation:** the first CORS probe used plain `curl` with no `Origin` header, so no `access-control-allow-origin` could ever come back — a false negative that would have pointed the fix toward building an unnecessary relay proxy."},{"file":"cc-session-2026-07-26-real-weather-and-geocode-race.md","title":"CC Session Outbox — Real Open-Meteo Weather + VenueGeocodeRace","date":"2026-07-26","phrase":"false positive","sentence":"Indoor venues (Footprint Center, Target Center) excluded by simply having no coordinate entry — deliberately not porting production\'s fuzzy indoor-keyword classifier, which has a real false positive on this repo\'s venue list (`\\"Red Bull Arena\\"` contains `\\"arena\\"` but is an outdoor MLS stadium)."},{"file":"cc-session-2026-07-26-venue-coord-audit-fix.md","title":"CC Session Outbox — Venue Coordinate Audit (Globe Lif
